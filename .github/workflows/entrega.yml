name: Publicar entrega validada
# Importacao unica de arquivos produzidos e testados no ambiente de desenvolvimento.
# O payload ZIP possui hash SHA-256 e inclui codigo, PNGs e documentacao.
# Nao executa o programa grafico e nao consulta segredos do repositorio.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/entrega.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar pacote e publicar tres commits
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, zipfile
          from pathlib import Path
          import subprocess
          payload = base64.b64decode('')
          assert hashlib.sha256(payload).hexdigest() == 'cc13f6a88aa9f8e0c709bd18ff02143e91ed72428ba058482f63b93cefdb5e9d'
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for item in archive.infolist():
                  path = Path(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(archive.read(item))
          def git(*args):
              subprocess.run(['git', *args], check=True)
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          groups = [
              ('chore: integrar componentes didaticos e dependencias', ['.gitignore','requirements.txt','core','geometry']),
              ('feat: implementar Operacao Rover com texturas e shadow mapping', ['main.py','models','scene','rendering','shaders','assets']),
              ('docs: registrar testes reais fontes e roteiro de apresentacao', ['README.md','docs','tests','tools'])
          ]
          for message, paths in groups:
              git('add', '--', *paths)
              changed = subprocess.run(['git','diff','--cached','--quiet']).returncode
              if changed:
                  git('commit','-m',message)
          git('push','origin','HEAD:main')
          PY
